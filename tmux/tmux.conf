# tmux config — base is omerxx/dotfiles' screen-emulation config
# (https://github.com/omerxx/dotfiles), prefix is now ^A not C-b.
# Kept on top: your terminal/RGB setup + your own key bindings, and where a
# key clashed with one you already owned, your binding won (noted inline).

# 256 + truecolor + extended keys for ghostty
# xterm-256color (not tmux-256color, not omerxx's screen-256color) —
# macOS terminfo for tmux-256color/screen-256color lacks shift/ctrl arrow
# caps, breaks micro/vim navigation
set -g  default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -as terminal-features  ",xterm-256color:RGB,xterm-ghostty:extkeys,RGB"
set -as terminal-features  ",xterm-256color:hyperlinks,xterm-ghostty:hyperlinks"

# Alt/Meta combos: kill 500ms escape delay
set -sg escape-time 10

# Pass modifyOtherKeys / extended keys (Ctrl+Shift, Alt, Shift+arrows)
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse: wheel scroll, drag-select, pane resize
set -g mouse on

# Default word-separators splits on / : . etc, so a plain click only ever
# grabs a URL fragment (e.g. "github"). Empty it so URLs/paths count as one
# word (trade-off: double-click word-select now selects whole paths, not
# sub-segments).
set -g word-separators ""

# Plain left-click opens a URL/OSC8 hyperlink under the cursor instead of
# just selecting the pane; anywhere else, falls back to normal pane-select.
bind-key -n MouseDown1Pane if-shell -F "#{||:#{mouse_hyperlink},#{m:http*,#{mouse_word}}}" \
  "run-shell -b \"open '#{q:#{?#{mouse_hyperlink},#{mouse_hyperlink},#{mouse_word}}}'\"" \
  "select-pane -t=; send-keys -M"

# Windows + panes start at 1 (match keyboard row, prefix 1 = first)
set -g  base-index 1
setw -g pane-base-index 1
# Close gaps after killing a window
set -g  renumber-windows on

# Don't shrink pane history when other client smaller
setw -g aggressive-resize on

# Focus events for editors (vim/micro autoread etc)
set -g focus-events on

# Pane-scoped mouse selection → system clipboard (OSC 52)
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- omerxx/dotfiles tmux.conf below (verbatim, minus conflicts) ---

set -g history-limit 50000  # kept yours, his wanted 10000
set -g monitor-activity on
set -g status on
set -g status-position top  # kept yours, he doesn't set this (defaults to bottom)
set -g status-interval 2
set -g automatic-rename off

# Catppuccin (mocha) — same plugin omerxx/dotfiles runs, not a hand-rolled
# imitation. Gives real rounded-pill windows via @catppuccin_window_status_style,
# and since @catppuccin_window_flags defaults to "none" there's no "*"/"-"/"!"
# on the current/last/bell window either.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "none"
# Show the window's #W (rename target of `,`, since automatic-rename is off)
# instead of the plugin's default #T pane title.
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
# Default pill backgrounds (surface_0 inactive, surface_1 active) sit one
# shade apart — too close to tell active/inactive apart at a glance. Bump
# active further up the mocha ladder for real contrast.
set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"

# Rainbow tab-number badges — blue/sky/peach/green/mauve/yellow cycling by
# window index — instead of catppuccin's default single mauve/overlay scheme,
# to match the per-tab colors in the reference screenshot. `#{e|-:...}` /
# `#{e|%:...}` are tmux's arithmetic format operators (3.1+); this whole
# expression gets expanded in one shot when catppuccin reads the option via
# its own #{E:@catppuccin_window_*_number_color}.
set -g @catppuccin_window_number_color         "#{?#{==:#{e|%:#{e|-:#{window_index},1},6},0},#{@thm_blue},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},1},#{@thm_sky},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},2},#{@thm_peach},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},3},#{@thm_green},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},4},#{@thm_mauve},#{@thm_yellow}}}}}}"
set -g @catppuccin_window_current_number_color "#{?#{==:#{e|%:#{e|-:#{window_index},1},6},0},#{@thm_blue},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},1},#{@thm_sky},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},2},#{@thm_peach},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},3},#{@thm_green},#{?#{==:#{e|%:#{e|-:#{window_index},1},6},4},#{@thm_mauve},#{@thm_yellow}}}}}}"

# Rounded style's default middle-separator is a literal space between the
# window name and the number badge; the number-right format then adds its
# own leading space before the number too, so name/badge end up two spaces
# apart. Zero the middle-separator so only that one built-in space remains.
set -g @catppuccin_window_middle_separator ""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'

# Status bar modules (loaded after the plugin defines #{E:@catppuccin_status_*})
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}#[bg=default] "
set -g status-right "#{E:@catppuccin_status_directory}"
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# Screen-style keys (Nicholas Marriott, public domain). Prefix kept at C-b
# (his config wanted ^A — reverted, C-b muscle memory kept)
set -g prefix C-b
bind b send-prefix

unbind ^X
bind ^X lock-server
unbind ^C
bind ^C new-window
bind n new-window -c "#{pane_current_path}"
unbind ^D
bind ^D detach
unbind *
bind * list-clients
unbind ^@
bind ^@ next-window
unbind ^N
bind ^N next-window
unbind " "
bind " " next-window
unbind W
bind W next-window
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"  # kept yours, not his rename-window
unbind ^A
bind ^A last-window
unbind ^H
bind ^H previous-window
unbind ^P
bind ^P previous-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window
unbind ^W
bind ^W list-windows
unbind w
bind w list-windows
unbind '\'
bind '\' confirm-before "kill-server"
# dropped his "unbind K/bind K confirm-before kill-window" (kept as K, no clash) —
unbind K
bind K confirm-before "kill-window"
# NOTE: his plain "unbind k / bind k confirm-before kill-window" dropped —
# k stays your vim pane-nav (select-pane -U) below
unbind ^L
bind ^L refresh-client
# NOTE: his plain "unbind l / bind l refresh-client" dropped —
# l stays your vim pane-nav (select-pane -R) below
unbind |
bind | split-window
unbind Tab
bind Tab select-pane -t:.+
unbind BTab
bind BTab select-pane -t:.-
unbind '"'
bind '"' choose-window

# vim-keys.conf (Daniel Thau, public domain)
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation (prefix + hjkl) — yours, same as his, kept once
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# dropped his resize binds on , . - = — clobbered stock rename-window (,)
# and other defaults; resize already covered by tmux default prefix+arrows.
# unbind doesn't restore a compiled default once overwritten, so restate it:
bind , command-prompt -I "#W" { rename-window "%%" }
bind : command-prompt
setw -g mode-keys vi

# Omer's extras
unbind *
bind * setw synchronize-panes

unbind R
set pane-border-status off
bind P set pane-border-status

unbind c
bind c kill-pane

unbind x
bind x swap-pane -D

bind S choose-session

# Pane border / message styling — his config doesn't set these at all, kept
# yours (plain hex mocha values, not routed through the catppuccin plugin's
# #{@thm_*} vars since pane borders/messages aren't plugin-managed)
set -g pane-border-style         "fg=#45475a"
set -g pane-active-border-style  "fg=#cba6f7"
set -g message-style             "bg=#313244,fg=#cdd6f4"
set -g message-command-style     "bg=#313244,fg=#cdd6f4"

run '~/.tmux/plugins/tpm/tpm'

# Catppuccin sets window-status-separator itself when it loads above, so this
# has to come after `run tpm` to actually stick (last write wins). Plugin
# default is two spaces between pills — too wide; small 2-char gap instead.
set -g window-status-separator " "

# Source local overrides if present
if-shell "[ -f ~/.tmux.conf.local ]" "source ~/.tmux.conf.local"
