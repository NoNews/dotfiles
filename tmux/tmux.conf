# tmux config

# 256 + truecolor + extended keys for ghostty
# xterm-256color (not tmux-256color) — macOS terminfo for tmux-256color
# lacks shift/ctrl arrow caps, breaks micro/vim navigation
set -g  default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"
set -as terminal-features  ",xterm-256color:RGB,xterm-ghostty:extkeys,RGB"

# Alt/Meta combos: kill 500ms escape delay
set -sg escape-time 10

# Pass modifyOtherKeys / extended keys (Ctrl+Shift, Alt, Shift+arrows)
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Mouse: wheel scroll, drag-select, pane resize
set -g mouse on

# Windows + panes start at 1 (match keyboard row, prefix 1 = first)
set -g  base-index 1
setw -g pane-base-index 1
# Close gaps after killing a window
set -g  renumber-windows on

# Big scrollback (per-pane, set at pane creation)
set -g history-limit 50000

# Don't shrink pane history when other client smaller
setw -g aggressive-resize on

# Focus events for editors (vim/micro autoread etc)
set -g focus-events on

# Vim-style pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config (prefix + r)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane-scoped mouse selection → system clipboard (OSC 52)
set -g set-clipboard on
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Catppuccin (Mocha, standard palette)
set -g @ctp_rosewater "#f5e0dc"
set -g @ctp_flamingo  "#f2cdcd"
set -g @ctp_pink      "#f5c2e7"
set -g @ctp_mauve     "#cba6f7"
set -g @ctp_red       "#f38ba8"
set -g @ctp_maroon    "#eba0ac"
set -g @ctp_peach     "#fab387"
set -g @ctp_yellow    "#f9e2af"
set -g @ctp_green     "#a6e3a1"
set -g @ctp_teal      "#94e2d5"
set -g @ctp_sky       "#89dceb"
set -g @ctp_sapphire  "#74c7ec"
set -g @ctp_blue      "#89b4fa"
set -g @ctp_lavender  "#b4befe"
set -g @ctp_text      "#cdd6f4"
set -g @ctp_subtext1  "#bac2de"
set -g @ctp_subtext0  "#a6adc8"
set -g @ctp_overlay2  "#9399b2"
set -g @ctp_overlay1  "#7f849c"
set -g @ctp_overlay0  "#6c7086"
set -g @ctp_surface2  "#585b70"
set -g @ctp_surface1  "#45475a"
set -g @ctp_surface0  "#313244"
set -g @ctp_base      "#1e1e2e"
set -g @ctp_mantle    "#181825"
set -g @ctp_crust     "#11111b"

# Apply Catppuccin to status bar / borders / messages
set -g status-position top
set -g status-style          "bg=#{@ctp_base},fg=#{@ctp_text}"
set -g status-left-style     "bg=#{@ctp_base},fg=#{@ctp_mauve}"
set -g status-right-style    "bg=#{@ctp_base},fg=#{@ctp_subtext0}"

# Windows as flat colored blocks: idle = muted surface, active = mauve pill
set -g  window-status-separator ""
setw -g window-status-format         "#[bg=#{@ctp_surface0},fg=#{@ctp_subtext0}] #I:#W #[bg=#{@ctp_base}] "
setw -g window-status-current-format "#[bg=#{@ctp_mauve},fg=#{@ctp_base},bold] #I:#W #[bg=#{@ctp_base}] "

set -g pane-border-style         "fg=#{@ctp_surface1}"
set -g pane-active-border-style  "fg=#{@ctp_mauve}"
set -g message-style        "bg=#{@ctp_surface0},fg=#{@ctp_text}"
set -g message-command-style "bg=#{@ctp_surface0},fg=#{@ctp_text}"

# Source local overrides if present
if-shell "[ -f ~/.tmux.conf.local ]" "source ~/.tmux.conf.local"
